name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Сначала настраиваем Pages, чтобы получить BASE_URL
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # 2. Генерируем страницы для соцсетей (используем BASE_URL из шага выше)
      - name: Generate OG pages
        run: node generate-og.js  # <-- Убрали "scripts/"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          OUTPUT_DIR: .

      # 3. Загружаем все файлы (теперь они включают сгенерированную папку model)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # 4. Публикуем на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
